<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore Your Path — Opportunity Cards</title>
<style>
:root{--ink:#23314d;--muted:#68738a;--paper:#fffdf9;--accent:#6657e8}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Nunito","Avenir Next",system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:
radial-gradient(circle at 8% 5%,#fff1a8 0 7%,transparent 8%),
radial-gradient(circle at 92% 12%,#d9d2ff 0 9%,transparent 10%),
linear-gradient(135deg,#fffaf0,#f5f4ff 48%,#effcf8);min-height:100vh}
header{max-width:1180px;margin:auto;padding:56px 22px 20px;text-align:center}
.badge{display:inline-block;background:#fff;border:2px solid #ebe7ff;border-radius:999px;padding:8px 14px;font-weight:800;color:#6657e8;box-shadow:0 6px 20px #5b4fd214}
h1{font-size:clamp(2.2rem,5vw,4.2rem);line-height:.98;margin:18px auto 14px;max-width:850px;letter-spacing:-.04em}
.lead{max-width:720px;margin:auto;color:var(--muted);font-size:1.05rem}
.controls{max-width:1180px;margin:22px auto 10px;padding:0 22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input,select,button{font:inherit;border:1px solid #dedbea;background:#fff;border-radius:14px;padding:11px 14px;color:var(--ink)}
input{min-width:min(360px,90vw)}button{cursor:pointer;font-weight:800}button:hover{transform:translateY(-1px)}
.grid{max-width:1180px;margin:20px auto 70px;padding:0 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{height:365px;perspective:1200px;cursor:pointer;outline:none}.inner{position:relative;width:100%;height:100%;transition:transform .62s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:25px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 35px #29314b1c;border:1px solid #ffffffb8;overflow:auto}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(145deg,var(--c1),var(--c2))}
.front .num{position:absolute;top:18px;left:20px;font-size:.8rem;font-weight:900;opacity:.6}.icon{font-size:3.4rem;filter:drop-shadow(0 5px 5px #0001)}
.front h2{font-size:1.55rem;line-height:1.08;margin:18px 0 10px}.theme{font-size:.92rem;font-weight:750;opacity:.72}.tap{margin-top:28px;font-size:.78rem;font-weight:850;background:#ffffffa8;border-radius:999px;padding:7px 11px}
.back{transform:rotateY(180deg);background:#fff;padding:20px 20px 22px}.back h3{margin:0 0 4px;font-size:1.2rem}.back .theme2{font-size:.8rem;color:#7468df;font-weight:900;margin-bottom:15px}
.label{font-size:.69rem;text-transform:uppercase;letter-spacing:.08em;font-weight:950;color:#8991a3;margin:12px 0 4px}.text{font-size:.88rem;line-height:1.38}
.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{background:#f0efff;color:#574db8;border-radius:999px;padding:4px 7px;font-size:.68rem;font-weight:850}
.action{margin-top:13px;padding:11px 12px;border-radius:14px;background:#fff4c8;font-size:.83rem;line-height:1.35;font-weight:720}
.empty{text-align:center;grid-column:1/-1;color:var(--muted);padding:50px}.hint{text-align:center;color:#7d8494;font-size:.8rem;margin:-52px 0 40px}
@media(max-width:560px){header{padding-top:38px}.card{height:350px}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head>
<body>
<header><div class="badge">✨ 22 ways to explore, contribute & grow</div><h1>What kind of impact do you want to make?</h1>
<p class="lead">Explore opportunities that connect your values, interests and skills. Tap any card to discover ways to turn what matters to you into action.</p></header>
<div class="controls"><input id="q" placeholder="🔎 Search themes, values, opportunities…"><select id="filter"><option value="">All themes</option></select><button id="flip">Flip all</button><button id="reset">Reset</button></div>
<main class="grid" id="grid"></main><div class="hint">Tip: click a card — or use Enter/Space — to flip it.</div>
<script>
const cards=[{"n": 1, "title": "Make Every Resource Count", "icon": "🍽️", "theme": "Social Impact & Responsibility", "opps": "IEx Food Security; Food Rescue Projects; Conservation Internship", "values": "ALTRUISM, COMMUNITY, JUSTICE", "skills": "Teamwork, Leadership, Problem-Solving", "action": "Volunteer in a food rescue program or design a community project to reduce food waste."}, {"n": 2, "title": "Care for Well-being", "icon": "💚", "theme": "Public Health & Equity", "opps": "IEx Public Health; Tech for Social Good; Local Social Service Internships", "values": "HEALTH, EMOTIONAL WELLBEING, ALTRUISM", "skills": "Empathy, Community Engagement, Research", "action": "Support health initiatives or design campaigns promoting well-being."}, {"n": 3, "title": "Protect Our Planet", "icon": "🌱", "theme": "Environmental Sustainability", "opps": "IEx Environmental Sustainability; GEx Disaster Resilience; Sustainability Internships; Summer Research Internship Programme (SRIP); AUS", "values": "JUSTICE, ACHIEVEMENT, MASTERY", "skills": "Research, Advocacy, Sustainability Practices", "action": "Participate in environmental projects or develop sustainable solutions for your community."}, {"n": 4, "title": "Express Your Creativity", "icon": "🎨", "theme": "Arts & Social Engagement", "opps": "IEx Art & Social Engagement; NUSC Improv; NUSCreatives; GEx Art, Culture & Nature; Internships in Creative Industry", "values": "CREATIVITY, PASSION, AESTHETICS", "skills": "Artistic Expression, Communication, Innovation", "action": "Create a performance or project that engages and inspires your community."}, {"n": 5, "title": "Innovate and Inspire", "icon": "💡", "theme": "Social Design & Innovation", "opps": "IEx Social Design; Educational Innovation & Design; GEx Tech & Entrepreneurship; InfiniUse; AUS; Social Innovation Internships", "values": "CREATIVITY, MASTERY, AUTONOMY", "skills": "Problem-Solving, Design Thinking, Collaboration", "action": "Design a solution to a social challenge or prototype an innovative project."}, {"n": 6, "title": "Champion Equity & Inclusion", "icon": "🤝", "theme": "Social Justice & Inclusion", "opps": "IEx Housing & Inequality; Underserved Communities; GEx Global City; IEx Inclusion in Education; AUS; Social Enterprise Internship; SIIP", "values": "JUSTICE, DIGNITY, HARMONY", "skills": "Advocacy, Empathy, Policy Understanding", "action": "Lead or participate in projects addressing social inequalities."}, {"n": 7, "title": "Empower Through Learning", "icon": "📚", "theme": "Education & Personal Growth", "opps": "IEx Inclusion in Education; Educational Innovation; Youth Development Internships; Summer School", "values": "KNOWLEDGE, AUTONOMY, ACHIEVEMENT", "skills": "Teaching, Mentorship, Leadership", "action": "Support educational initiatives or create innovative learning experiences."}, {"n": 8, "title": "Amplify Voices", "icon": "📣", "theme": "Indigeneity & Human Rights", "opps": "IEx Indigeneity & Human Rights; Bajau Laut; Indigenous Communities; GEx Intangible Heritage; SIIP; AUS", "values": "JUSTICE, LOYALTY, ALTRUISM", "skills": "Advocacy, Cultural Awareness, Community Engagement", "action": "Support indigenous or marginalized communities through projects or advocacy."}, {"n": 9, "title": "Preserve Heritage", "icon": "🏺", "theme": "Cultural Heritage & Continuity", "opps": "IEx Cultural Heritage; Indonesian Arts; Cambodia; Vietnam Delta; GEx Arts Diplomacy; AUS; SRIP", "values": "FAMILY, LOYALTY, HARMONY", "skills": "Research, Cultural Understanding, Storytelling", "action": "Participate in heritage preservation or document cultural traditions."}, {"n": 10, "title": "Build Resilient Communities", "icon": "🏘️", "theme": "Rural Development & Livelihoods", "opps": "IEx Rural Development; Rural Communities; GEx Water’s Edge Livelihoods; SIIP; AUS", "values": "ACHIEVEMENT, COMMUNITY, HEALTH", "skills": "Project Management, Community Engagement, Resilience", "action": "Work with rural communities to improve livelihoods or infrastructure."}, {"n": 11, "title": "Advocate for Fairness", "icon": "⚖️", "theme": "Gender & Social Equality", "opps": "IEx Gender & Sexual Inequalities; Gender Collective IG; GEx Governance & Diversity; IEx Social Empowerment; AUS; SRIP", "values": "JUSTICE, DIGNITY, HUMILITY", "skills": "Advocacy, Policy Analysis, Leadership", "action": "Lead campaigns promoting equality or gender rights initiatives."}, {"n": 12, "title": "Sustain Our Oceans", "icon": "🌊", "theme": "Marine Conservation", "opps": "GEx Marine Ecosystems; SIIP Marine Education Internship; IEx Marine Science and Conservation", "values": "ALTRUISM, JUSTICE, ACHIEVEMENT", "skills": "Environmental Research, Education, Project Management", "action": "Join marine conservation projects or design awareness campaigns."}, {"n": 13, "title": "Adapt & Overcome", "icon": "🛟", "theme": "Disaster Resilience", "opps": "GEx Disaster Resilience; Sustainability Research Internships; SIIP Sustainable Development and Education", "values": "MASTERY, HEALTH, EMOTIONAL WELLBEING", "skills": "Problem-Solving, Resilience, Critical Thinking", "action": "Assist in disaster relief projects or develop resilience strategies."}, {"n": 14, "title": "Connect Across Cultures", "icon": "🌏", "theme": "Arts, Culture & Diplomacy", "opps": "AUS; GEx Arts & Diplomacy; AUS Regional Projects; IEx Cultural Heritage; IEx Arts, Culture, Nature; SIIP; Summer School", "values": "COMMUNITY, HARMONY, LOVE", "skills": "Communication, Cultural Awareness, Networking", "action": "Collaborate with diverse communities or cultural projects."}, {"n": 15, "title": "Innovate With Purpose", "icon": "💻", "theme": "Technology & Social Impact", "opps": "IEx Digital Innovation; Local Tech Internships; GEx City, Culture & Tech; IEx; AUS; SIIP", "values": "CREATIVITY, PASSION, AUTONOMY", "skills": "Digital Skills, Innovation, Problem-Solving", "action": "Develop tech solutions addressing social challenges."}, {"n": 16, "title": "Turn Ideas Into Action", "icon": "🚀", "theme": "Entrepreneurship & Start-ups", "opps": "AUS; NUSC Entrepreneurship Club; Start-up Internships; IEx; Impact Incubator", "values": "ACHIEVEMENT, PASSION, AUTONOMY", "skills": "Leadership, Project Management, Innovation", "action": "Launch or incubate a project with social or creative impact."}, {"n": 17, "title": "Show Solidarity & Compassion", "icon": "🫶", "theme": "Refugee & Migrant Support, Vulnerable population", "opps": "SIIP Refugee Support; Harmony Initiatives; Local NGO Internships; IEx Inclusion in Education; IEx Social Empowerment; IEx Food Rescue", "values": "ALTRUISM, COMMUNITY, LOVE", "skills": "Empathy, Advocacy, Communication", "action": "Volunteer or design initiatives supporting displaced communities."}, {"n": 18, "title": "Promote Balance & Wellness", "icon": "🏃", "theme": "Community Sports & Health", "opps": "NUSC Sports IGs; Ground-up: Stimulating Sweat Sessions; IEx Public Health; Internship", "values": "HEALTH, EMOTIONAL WELLBEING, HARMONY", "skills": "Teamwork, Physical Fitness, Leadership", "action": "Lead or participate in sports/fitness activities promoting wellness."}, {"n": 19, "title": "Create & Belong", "icon": "🎭", "theme": "Creative Communities", "opps": "NUSC Improv; Mandopop; Storytelling; Cinema; Productions; Rang Barse; IEx Creative Practice; Creative Internships", "values": "CREATIVITY, COMMUNITY, PASSION", "skills": "Artistic Skills, Collaboration, Confidence", "action": "Produce a creative project that fosters community engagement."}, {"n": 20, "title": "Seek Guidance & Grow", "icon": "🧭", "theme": "Alumni Mentorship", "opps": "Alumni Mentorship Programme (6 months); AUS", "values": "KNOWLEDGE, RECOGNITION, COMMUNITY", "skills": "Networking, Career Planning, Mentorship", "action": "Meet with an alumnus to learn about pathways and personal growth."}, {"n": 21, "title": "Lead & Serve", "icon": "🌟", "theme": "Leadership & Community Engagement", "opps": "AUS; House Committee; Student Management Committee; Ground-up Initiatives; Summer School", "values": "ACHIEVEMENT, COMMUNITY, PASSION", "skills": "Leadership, Planning, Communication", "action": "Take a leadership role to organize and serve your community."}, {"n": 22, "title": "Deepening Academic Expertise", "icon": "🎓", "theme": "Postgraduate Pathways", "opps": "Postgraduate Perspectives Workshops; SRIP; SIIP", "values": "ACHIEVEMENT, MASTERY, KNOWLEDGE", "skills": "Career Planning, Research, Critical Thinking", "action": "Explore postgraduate study options and plan your academic trajectory."}];
const palette=[["#ffe49d","#ffc9b8"],["#c8f1dc","#bce8ff"],["#c9efbd","#aee2cf"],["#ffd0e7","#d8c7ff"],["#ffe0a8","#d8d0ff"],["#cde9ff","#d5cffd"]];
const grid=document.querySelector("#grid"),q=document.querySelector("#q"),filter=document.querySelector("#filter");
[...new Set(cards.map(x=>x.theme))].sort().forEach(x=>filter.insertAdjacentHTML("beforeend",`<option>${x}</option>`));
function render(){
 const term=q.value.toLowerCase(), f=filter.value;
 const shown=cards.filter(c=>(!f||c.theme===f)&&JSON.stringify(c).toLowerCase().includes(term));
 grid.innerHTML=shown.length?shown.map((c,i)=>{let p=palette[(c.n-1)%palette.length];return `<article class="card" tabindex="0" role="button" aria-label="Flip card ${c.n}: ${c.title}" style="--c1:${p[0]};--c2:${p[1]}"><div class="inner">
 <section class="face front"><span class="num">CARD ${String(c.n).padStart(2,"0")}</span><div class="icon">${c.icon}</div><h2>${c.title}</h2><div class="theme">${c.theme}</div><div class="tap">Tap to explore ↗</div></section>
 <section class="face back"><h3>${c.icon} ${c.title}</h3><div class="theme2">${c.theme}</div>
 <div class="label">Opportunities</div><div class="text">${c.opps}</div>
 <div class="label">Aligned values</div><div class="pills">${c.values.split(", ").map(v=>`<span class="pill">${v}</span>`).join("")}</div>
 <div class="label">Skills developed</div><div class="text">${c.skills}</div>
 <div class="action"><b>⚡ Try this:</b> ${c.action}</div></section></div></article>`}).join(""):`<div class="empty">No cards match your search yet. Try another keyword.</div>`;
 document.querySelectorAll(".card").forEach(el=>{el.onclick=()=>el.classList.toggle("flipped");el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click()}}});
}
q.oninput=render;filter.onchange=render;
document.querySelector("#flip").onclick=()=>document.querySelectorAll(".card").forEach(x=>x.classList.add("flipped"));
document.querySelector("#reset").onclick=()=>{q.value="";filter.value="";render()};
render();
</script></body></html>
